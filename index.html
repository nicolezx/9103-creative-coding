<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>The Arrival of Spring in Woldgate</title>

    <link rel="stylesheet" type="text/css" href="style.css" />

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
  </head>

  <body>
    <script src="colors.js"></script>
    <script src="time.js"></script>
    <script src="utils.js"></script>
    <script src="trees.js"></script>
    <script src="bushes.js"></script>
    <script src="sketch.js"></script>
    <script src="user-input.js"></script>
    <div class="time-display">
      <div class="display-inner">
        <div class="label-group">
          <div class="label-between">
            <p class="hud-label">Current time&nbsp;</p>
            <p class="timestamp">&nbsp;</p>
          </div>
          <div class="meter" data-meter="time">
            <div class="meter-fill"></div>
          </div>
        </div>
        <div class="label-group">
          <div class="label-between">
            <p class="hud-label">Temperature&nbsp;</p>
            <p class="temperature">&nbsp;</p>
          </div>
          <div class="meter" data-meter="temperature">
            <div class="meter-fill"></div>
          </div>
        </div>
        <div class="label-group">
          <div class="label-between">
            <p class="hud-label">Moisture&nbsp;</p>
            <p class="conditions">&nbsp;</p>
          </div>
          <div class="meter" data-meter="moisture">
            <div class="meter-fill"></div>
          </div>
        </div>
        <div class="label-group">
          <div class="label-between">
            <p class="hud-label">Conditions&emsp;</p>
            <p class="conditions">&nbsp;</p>
          </div>
        </div>
      </div>
    </div>
    <!-- <script src="scripts/set-up.js"></script> -->
    <!-- <script src="scripts/user-input.js"></script> -->
  </body>
</html>
